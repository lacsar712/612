version: '3.9'

services:
  db:
    image: postgres:16.4-alpine
    container_name: lianzhi-wms-db
    environment:
      POSTGRES_DB: lianzhi_wms
      POSTGRES_USER: wms_user
      POSTGRES_PASSWORD: wms_pass_7f3b2
    ports:
      - "55491:5432"
    volumes:
      - wms_db_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: lianzhi-wms-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/lianzhi_wms
      SPRING_DATASOURCE_USERNAME: wms_user
      SPRING_DATASOURCE_PASSWORD: wms_pass_7f3b2
    ports:
      - "48123:48123"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
    container_name: lianzhi-wms-frontend
    environment:
      API_BASE: /api-7f3b2
    ports:
      - "49217:49217"
    depends_on:
      - backend

volumes:
  wms_db_data:
